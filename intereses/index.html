<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniBean - Intereses</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
    padding: 16px;
    padding-bottom: 100px;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
  .category {
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .category-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    background: #fafafa;
  }
  .category-header .count-badge {
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    background: #4caf50;
    border-radius: 10px;
    padding: 2px 8px;
    display: none;
  }
  .category-header .count-badge.show { display: inline-block; }
  .category-options {
    display: none;
    padding: 8px 16px 14px 16px;
  }
  .category-options.open { display: block; }
  .option {
    display: flex;
    align-items: center;
    padding: 10px 4px;
    font-size: 15px;
    border-bottom: 1px solid #f0f0f0;
  }
  .option:last-child { border-bottom: none; }
  .option input {
    width: 20px;
    height: 20px;
    margin-right: 12px;
    accent-color: #4caf50;
  }
  .arrow { transition: transform 0.2s; font-size: 14px; color: #999; }
  .arrow.open { transform: rotate(90deg); }
  .footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--tg-theme-bg-color, #fff);
    border-top: 1px solid #e0e0e0;
    padding: 12px 16px;
    text-align: center;
    font-size: 13px;
    color: #666;
  }
  .hint { font-size: 13px; color: #888; margin-top: 4px; min-height: 16px; }
</style>
</head>
<body>

<h1>¿Qué te gusta hacer? 🌱</h1>
<p class="subtitle">
  Esto es la base para encontrar a tu gente dentro de la universidad — personas
  con quienes de verdad vas a tener de qué hablar. Elige todo lo que te
  representa, sin pensarlo mucho. No hay respuestas correctas.
</p>

<div id="categories"></div>

<div class="footer-bar">
  <div id="counter">0 seleccionados</div>
  <div class="hint" id="hint"></div>
</div>

<script>
const DATA = {
  arte_creatividad: {
    label: "🎨 Arte y creatividad",
    options: {
      musica_tocar: "Música (tocar/cantar)",
      musica_escuchar: "Música (escuchar/conciertos)",
      dibujo_pintura: "Dibujo o pintura",
      fotografia_video: "Fotografía o video",
      escritura_creativa: "Escritura creativa",
      teatro: "Teatro o actuación",
      baile: "Baile",
      diseno: "Diseño (gráfico, moda, etc.)",
    },
  },
  deportes_movimiento: {
    label: "⚽ Deportes y movimiento",
    options: {
      futbol: "Fútbol",
      basquet_volley: "Básquetbol / volley",
      running: "Running o trote",
      gym: "Gym / pesas",
      yoga_pilates: "Yoga o pilates",
      ciclismo: "Ciclismo",
      raqueta: "Deportes de raqueta (tenis, pádel, etc.)",
      artes_marciales: "Artes marciales",
    },
  },
  estudio_mente: {
    label: "📚 Estudio y mente",
    options: {
      grupos_estudio: "Grupos de estudio por materia",
      idiomas: "Idiomas",
      debate_oratoria: "Debate o oratoria",
      lectura: "Lectura (club de libros)",
      ciencia_tecnologia: "Ciencia y tecnología",
      emprendimiento: "Emprendimiento o negocios",
      ajedrez: "Ajedrez y juegos de estrategia",
      programacion: "Programación / proyectos personales",
    },
  },
  naturaleza_vida_activa: {
    label: "🌳 Naturaleza y vida activa",
    options: {
      senderismo: "Senderismo (parques cercanos)",
      ciclismo_recreativo: "Ciclismo recreativo",
      fotografia_paisaje: "Fotografía de paisaje",
      picnic: "Picnic / día de campo",
      jardineria: "Jardinería",
      observacion_naturaleza: "Observación de aves/naturaleza",
    },
  },
  juegos_socializacion: {
    label: "🎲 Juegos y socialización",
    options: {
      juegos_mesa: "Juegos de mesa",
      videojuegos_casual: "Videojuegos (casual)",
      videojuegos_competitivo: "Videojuegos (competitivo/esports)",
      cartas: "Cartas (poker, uno, etc.)",
      trivia: "Trivia / quiz nights",
      karaoke: "Karaoke",
    },
  },
  comunidad_bienestar: {
    label: "🤝 Comunidad y bienestar",
    options: {
      voluntariado: "Voluntariado",
      cocina: "Cocina o repostería",
      mascotas: "Cuidado de mascotas/animales",
      meditacion: "Meditación o mindfulness",
      cine_series: "Cine y series (club)",
    },
  },
};

const MIN_INTERESES = 3;
const MAX_SUAVE = 12;
const selected = new Set(); // guarda "categoria|item"

const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

function render() {
  const container = document.getElementById("categories");
  container.innerHTML = "";

  for (const [catKey, cat] of Object.entries(DATA)) {
    const catDiv = document.createElement("div");
    catDiv.className = "category";

    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML = `
      <span>${cat.label}</span>
      <span style="display:flex; align-items:center; gap:8px;">
        <span class="count-badge" id="badge-${catKey}"></span>
        <span class="arrow" id="arrow-${catKey}">▶</span>
      </span>
    `;

    const optionsDiv = document.createElement("div");
    optionsDiv.className = "category-options";
    optionsDiv.id = `options-${catKey}`;

    for (const [itemKey, itemLabel] of Object.entries(cat.options)) {
      const id = `${catKey}|${itemKey}`;
      const opt = document.createElement("label");
      opt.className = "option";
      opt.innerHTML = `
        <input type="checkbox" data-id="${id}" data-cat="${catKey}" data-item="${itemKey}">
        <span>${itemLabel}</span>
      `;
      optionsDiv.appendChild(opt);
    }

    header.addEventListener("click", () => {
      const isOpen = optionsDiv.classList.contains("open");
      optionsDiv.classList.toggle("open", !isOpen);
      document.getElementById(`arrow-${catKey}`).classList.toggle("open", !isOpen);
    });

    catDiv.appendChild(header);
    catDiv.appendChild(optionsDiv);
    container.appendChild(catDiv);
  }

  container.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.id;
      if (cb.checked) selected.add(id);
      else selected.delete(id);
      updateCounters();
    });
  });

  updateCounters();
}

function updateCounters() {
  document.getElementById("counter").textContent = `${selected.size} seleccionados`;

  const countsByCat = {};
  for (const id of selected) {
    const [cat] = id.split("|");
    countsByCat[cat] = (countsByCat[cat] || 0) + 1;
  }
  for (const catKey of Object.keys(DATA)) {
    const badge = document.getElementById(`badge-${catKey}`);
    const n = countsByCat[catKey] || 0;
    badge.textContent = n;
    badge.classList.toggle("show", n > 0);
  }

  const hint = document.getElementById("hint");
  if (selected.size < MIN_INTERESES) {
    hint.textContent = `Selecciona al menos ${MIN_INTERESES} para que el match funcione bien`;
  } else if (selected.size > MAX_SUAVE) {
    hint.textContent = "Tienes intereses variados 🙌 puedes afinar un poco si quieres";
  } else {
    hint.textContent = "";
  }

  if (tg) {
    if (selected.size >= MIN_INTERESES) {
      tg.MainButton.setText(`Listo ✅ Enviar (${selected.size})`);
      tg.MainButton.show();
