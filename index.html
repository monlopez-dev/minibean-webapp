<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Disponibilidad — MiniBean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #F4F6F2;
    --surface: #FFFFFF;
    --ink: #1C2620;
    --ink-soft: #5B6B61;
    --line: #DCE3DA;
    --accent: #FF6B35;
    --accent-soft: #FFE1D0;
    --accent-deep: #E5502A;
    --radius: 10px;
  }
  html[data-theme="dark"] {
    --bg: #14201A;
    --surface: #1B2920;
    --ink: #EDF2EC;
    --ink-soft: #9AB0A2;
    --line: #2A3A30;
    --accent: #FF7A45;
    --accent-soft: #3A2A22;
    --accent-deep: #FF8F5E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header { padding: 16px 18px 10px; flex-shrink: 0; }
  h1 {
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 19px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px;
  }
  .sprout { width: 22px; height: 22px; flex-shrink: 0; transition: transform .25s ease; }
  p.hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.4; }

  .meter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .meter-text { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }
  .meter-text b { color: var(--accent); font-weight: 600; }
  .clear-btn {
    font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--ink-soft);
    background: none; border: none; text-decoration: underline; padding: 4px; cursor: pointer;
  }

  .grid-wrap {
    flex: 1; overflow: hidden; margin: 0 10px 10px;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface); display: flex; flex-direction: column;
  }
  .grid-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; }

  table.grid { border-collapse: collapse; width: 100%; table-layout: fixed; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--surface);
    font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px;
    color: var(--ink-soft); padding: 8px 0; border-bottom: 1px solid var(--line);
    text-align: center;
  }
  thead th.corner { left: 0; z-index: 3; width: 52px; }
  tbody td.time-label {
    position: sticky; left: 0; z-index: 1; background: var(--surface);
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-soft);
    text-align: right; padding-right: 6px; white-space: nowrap; border-right: 1px solid var(--line);
    width: 52px;
  }
  td.cell {
    border: 1px solid var(--line); height: 22px;
    background: var(--surface); touch-action: pan-y;
    -webkit-touch-callout: none;
    transition: background .08s ease;
  }
  td.cell.on { background: var(--accent); border-color: var(--accent-deep); }
  td.cell.hour-start { border-top: 1.5px solid var(--line); }

  footer { flex-shrink: 0; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }
  .save-btn {
    width: 100%; border: none; border-radius: var(--radius); padding: 13px;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .save-btn:disabled { background: var(--line); color: var(--ink-soft); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>
      <svg class="sprout" id="sproutIcon" viewBox="0 0 24 24" fill="none">
        <path d="M12 21V12" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 12C12 7 8 5 4 5C4 9.5 7 12 12 12Z" fill="var(--accent)"/>
        <path d="M12 12C12 8 15.5 6.5 19 7C18.6 10.5 16 12.5 12 12Z" fill="var(--accent)" opacity="0.7"/>
      </svg>
      Marcá tus horarios libres
    </h1>
    <p class="hint">Mantené presionado y arrastrá para pintar varios bloques. Un toque marca uno solo.</p>
    <div class="meter-row">
      <span class="meter-text" id="meterText"><b>0h</b> marcadas</span>
      <button class="clear-btn" id="clearBtn">borrar todo</button>
    </div>
  </header>

  <div class="grid-wrap">
    <div class="grid-scroll" id="gridScroll">
      <table class="grid" id="grid"></table>
    </div>
  </div>

  <footer>
    <button class="save-btn" id="saveBtn" disabled>Guardá tu disponibilidad</button>
  </footer>
</div>

<script>
(function () {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light');
    tg.onEvent('themeChanged', () => {
      document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light');
    });
  }

  // ---- Config (ajustable) ----
  const DAYS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const START_HOUR = 8;
  const END_HOUR = 23;
  const STEP_MIN = 30;

  const rows = [];
  for (let h = START_HOUR; h < END_HOUR; h++) {
    for (let m = 0; m < 60; m += STEP_MIN) rows.push({ h, m });
  }

  function timeLabel(h, m) {
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  // ---- Build grid ----
  const grid = document.getElementById('grid');

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  headRow.innerHTML = '<th class="corner"></th>' + DAYS.map(d => `<th>${d}</th>`).join('');
  thead.appendChild(headRow);
  grid.appendChild(thead);

  const tbody = document.createElement('tbody');
  const state = {}; // key "dayIdx_h_m" -> boolean

  rows.forEach(({ h, m }) => {
    const tr = document.createElement('tr');
    const labelTd = document.createElement('td');
    labelTd.className = 'time-label';
    labelTd.textContent = m === 0 ? timeLabel(h, m) : '';
    tr.appendChild(labelTd);

    DAYS.forEach((_, dayIdx) => {
      const td = document.createElement('td');
      td.className = 'cell' + (m === 0 ? ' hour-start' : '');
      const key = `${dayIdx}_${h}_${m}`;
      td.dataset.key = key;
      state[key] = false;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  grid.appendChild(tbody);

  // ---- Selection logic ----
  let dragging = false;
  let dragValue = true;
  let longPressTimer = null;
  let startKey = null;
  let movedBeforeFire = false;
  let pointerStart = null;

  const meterText = document.getElementById('meterText');
  const saveBtn = document.getElementById('saveBtn');
  const sproutIcon = document.getElementById('sproutIcon');

  function setCell(key, value) {
    if (state[key] === value) return;
    state[key] = value;
    const el = grid.querySelector(`[data-key="${key}"]`);
    if (el) el.classList.toggle('on', value);
  }

  function updateMeter() {
    const total = Object.values(state).filter(Boolean).length;
    const hours = total * (STEP_MIN / 60);
    meterText.innerHTML = `<b>${hours.toFixed(1)}h</b> marcadas`;
    saveBtn.disabled = total === 0;
    const scale = Math.min(1.3, 0.85 + total * 0.01);
    sproutIcon.style.transform = `scale(${scale})`;
  }

  function cellFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return (el && el.classList && el.classList.contains('cell')) ? el : null;
  }

  function haptic(style) {
    try { tg?.HapticFeedback?.impactOccurred(style || 'light'); } catch (e) {}
  }

  grid.addEventListener('pointerdown', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    pointerStart = { x: e.clientX, y: e.clientY };
    movedBeforeFire = false;
    startKey = cell.dataset.key;
    const startValue = !state[startKey];

    if (e.pointerType === 'mouse') {
      dragging = true;
      dragValue = startValue;
      setCell(startKey, dragValue);
      updateMeter();
    } else {
      longPressTimer = setTimeout(() => {
        if (movedBeforeFire) return;
        dragging = true;
        dragValue = startValue;
        setCell(startKey, dragValue);
        updateMeter();
        haptic('medium');
      }, 220);
    }
  });

  grid.addEventListener('pointermove', (e) => {
    if (pointerStart) {
      const dx = Math.abs(e.clientX - pointerStart.x);
      const dy = Math.abs(e.clientY - pointerStart.y);
      if (dx > 8 || dy > 8) movedBeforeFire = true;
    }
    if (!dragging) return;
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (cell) {
      setCell(cell.dataset.key, dragValue);
      updateMeter();
    }
  });

  function endPointer(e) {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (!dragging && startKey && !movedBeforeFire) {
      // toque simple: alterna una sola celda
      setCell(startKey, !state[startKey]);
    }
    dragging = false;
    startKey = null;
    pointerStart = null;
    updateMeter();
  }

  grid.addEventListener('pointerup', endPointer);
  grid.addEventListener('pointercancel', endPointer);

  grid.addEventListener('touchmove', (e) => {
    if (dragging) e.preventDefault();
  }, { passive: false });

  document.getElementById('clearBtn').addEventListener('click', () => {
    Object.keys(state).forEach(k => setCell(k, false));
    updateMeter();
    haptic('light');
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const availability = {};
    DAYS.forEach(d => availability[d] = []);
    rows.forEach(({ h, m }) => {
      DAYS.forEach((day, dayIdx) => {
        const key = `${dayIdx}_${h}_${m}`;
        if (state[key]) availability[day].push(timeLabel(h, m));
      });
    });
    const payload = { availability };
    if (tg) {
      tg.sendData(JSON.stringify(payload));
    } else {
      alert(JSON.stringify(payload, null, 2));
    }
  });

  updateMeter();
})();
</script>
</body>
</html>
